name: PassPony
options:
  bundleIdPrefix: dev.norsehorse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AgePonyCore:
    path: ../AgePony
  NorseHorsePGPCore:
    path: ../NorseHorsePGPCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Version, build number, and team live HERE, not in the Xcode UI.
    # This is a generated project: anything set in Xcode's target editor
    # is silently reverted to these values on the next xcodegen run.
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4AVJZV35G8
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

schemes:
  PassPony:
    build:
      targets:
        PassPony: all
    run:
      config: Debug
      executable: PassPony
    archive:
      config: Release
  PassPonyAutofill:
    build:
      targets:
        PassPonyAutofill: all
        PassPony: all
    run:
      config: Debug
  # App Store screenshots only: fastlane snapshot runs this scheme's test
  # action (UITests/SnapshotTests.swift) against a DEBUG build launched with
  # -seedDemoStore. See fastlane/Snapfile.
  PassPonySnapshots:
    build:
      targets:
        PassPony: all
        PassPonyUITests: [test]
    test:
      config: Debug
      targets:
        - PassPonyUITests

targets:
  PassPony:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
      - Sources/Generated
    dependencies:
      - target: PassPonyAutofill
        embed: true
      - framework: Vendor/PassFFI.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - package: AgePonyCore
      - package: NorseHorsePGPCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.passpony
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/App/PassPony.entitlements
        SWIFT_OBJC_INTEROP_MODE: objc
        LIBRARY_SEARCH_PATHS: "$(inherited)"
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: PassPony
        UILaunchScreen: {}
        # NFC smartcard scaffolding removed for the first store submission;
        # the feature is not implemented yet (spike memo: PassPonyCore
        # docs/spike-corenfc-credential-extension.md). To restore when the
        # smartcard path ships, add back here:
        #   NFCReaderUsageDescription (translations already live in
        #   Sources/App/InfoPlist.xcstrings)
        #   com.apple.developer.nfc.readersession.iso7816.select-identifiers:
        #     ["D27600012401"]
        # and the nfc.readersession.formats [TAG] entitlement in
        # Sources/App/PassPony.entitlements.
        NSFaceIDUsageDescription: >-
          Face ID protects access to your password store.
        NSCameraUsageDescription: >-
          PassPony uses the camera to scan QR codes when you set up a one-time code.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PassPonyAutofill:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Autofill
      - Sources/Shared
      - Sources/Generated
    dependencies:
      - framework: Vendor/PassFFI.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - package: AgePonyCore
      - package: NorseHorsePGPCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.passpony.autofill
        CODE_SIGN_ENTITLEMENTS: Sources/Autofill/PassPonyAutofill.entitlements
    info:
      path: Sources/Autofill/Info.plist
      properties:
        CFBundleDisplayName: PassPony Autofill
        NSFaceIDUsageDescription: >-
          Face ID unlocks your password store for autofill.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            # Required on modern iOS for the provider to appear in
            # Settings > AutoFill & Passwords. Passwords, and passkeys
            # since 2.0; add ProvidesOneTimeCodes when the extension
            # implements that request type.
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true

  PassPonyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PassPony
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.passpony.uitests
        TEST_TARGET_NAME: PassPony
        GENERATE_INFOPLIST_FILE: YES
