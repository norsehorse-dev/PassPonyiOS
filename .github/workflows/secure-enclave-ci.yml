name: Secure Enclave age compatibility
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pgp-compat:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and patch the public OpenPGP dependency
        run: |
          git clone https://github.com/norsehorse-dev/NorseHorsePGPCore.git ../NorseHorsePGPCore
          git -C ../NorseHorsePGPCore checkout 891670cd4806fdf26927c37f73fb1447b0d16887
          bash scripts/prepare-pgpcore.sh
      - name: Run OpenPGP conformance tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime, devices in d.items() if "iOS" in runtime for x in devices if x["isAvailable"] and "iPhone" in x["name"]))')
          cd ../NorseHorsePGPCore
          xcodebuild test -scheme NorseHorsePGPCore -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
  age-interop:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned age library
        run: |
          git clone https://github.com/norsehorse-dev/AgePonyiOS.git ../AgePony
          git -C ../AgePony checkout 788f596df6027ce4e629acd41d0f68ffea06074d
      - name: Test the shared age engine against gopass fixture
        env:
          # Public recipient of a disposable local test key, not a user key.
          PASSPONY_INTEROP_RECIPIENT: age1lnmeq4xp22lf40k2u0zx66m5jutwukhfzvvv2v2xk89984alxq7qy4h53d
        run: bash scripts/test-age-interop.sh
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git clone https://github.com/norsehorse-dev/PassPonyCore.git ../PassPonyCore
          git -C ../PassPonyCore checkout 222fe1eb59eaa50dd45b5be2d2770be3121a132b
          git clone https://github.com/norsehorse-dev/AgePonyiOS.git ../AgePony
          git -C ../AgePony checkout 788f596df6027ce4e629acd41d0f68ffea06074d
          git clone https://github.com/norsehorse-dev/NorseHorsePGPCore.git ../NorseHorsePGPCore
          git -C ../NorseHorsePGPCore checkout 891670cd4806fdf26927c37f73fb1447b0d16887
          bash scripts/prepare-pgpcore.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore Rust build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/passponycore-cargo-target
          key: passpony-core-${{ runner.os }}-${{ runner.arch }}-222fe1e-rust195-lto-off-v1
      - name: Build shared Rust framework
        env:
          PASSPONY_CORE: ${{ github.workspace }}/../PassPonyCore
          # The simulator check exercises correctness, not optimized release
          # performance. Avoid link-time optimization across three targets.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: bash scripts/build-core.sh
      - name: Save Rust build cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/passponycore-cargo-target
          key: passpony-core-${{ runner.os }}-${{ runner.arch }}-222fe1e-rust195-lto-off-v1
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test on an iOS simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime, devices in d.items() if "iOS" in runtime for x in devices if x["isAvailable"] and "iPhone" in x["name"]))')
          xcodebuild test -project PassPony.xcodeproj -scheme PassPony -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
